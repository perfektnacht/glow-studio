# Shared by the CI check and by `qmllint -I <dir-with-qs-symlink> *.qml` locally,
# so a clean run here means a clean run there.
#
# What stays fatal is what actually breaks the plugin: a syntax error, or an
# import that does not resolve against a real Omarchy shell checkout.
#
# The categories below are switched off because qmllint cannot see through
# Quickshell's dynamic types, not because the code is unclean: singletons
# reached through qs.Commons resolve as bare QObject, so every Style/Color/Util
# reference reads as unqualified access to a missing property, and Canvas
# methods on an aliased Item read the same way. They would drown a real finding.
[General]
AbsolutePath=false
DisableDefaultImports=false
[Warnings]
UnqualifiedAccess=disable
MissingProperty=disable
MissingType=disable
BadSignalHandlerParameters=disable
UnusedImports=disable
PropertyOverride=disable
